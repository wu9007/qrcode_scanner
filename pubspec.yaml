name: qrscan
description: Flutter plugin for scanning QR codes and barcodes, and generating QR images. Android (CameraX + ZXing) and iOS (Vision).
version: 0.4.0
homepage: https://github.com/wu9007/qrcode_scanner
repository: https://github.com/wu9007/qrcode_scanner
issue_tracker: https://github.com/wu9007/qrcode_scanner/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.shinow.qrscan
        pluginClass: QrscanPlugin
      ios:
        pluginClass: QrscanPlugin
