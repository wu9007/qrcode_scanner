# Publishes to pub.dev when GitHub automated publishing is enabled
# for wu9007/qrcode_scanner on https://pub.dev/packages/qrscan/admin
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1
      - name: SDK versions
        run: |
          flutter --version
          dart --version
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          echo "OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
      - run: flutter pub get
      - name: Dry-run
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish --force
