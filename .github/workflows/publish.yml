# Publishes to pub.dev when GitHub automated publishing is enabled
# for wu9007/qrcode_scanner on https://pub.dev/packages/qrscan/admin
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Publish to pub.dev
        run: dart pub publish --force
